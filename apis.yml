name: aplum
description: >-
  aplum (branded Plum, Chinese 红布林) is a Beijing-based online marketplace for
  second-hand and pre-owned luxury fashion, founded in 2017. It runs C2B2C and
  B2B2C models — authenticating, grading, photographing, and reselling used
  designer apparel, handbags, watches, and accessories through its mobile app
  and website. Plum raised a $100M Series C from Zhuanzhuan Group in 2022, and
  earlier venture rounds from Qiming Venture Partners and Matrix Partners China.
  The platform is consumer-facing (Android app com.aplum.androidapp and mobile
  web m.aplum.com); it publishes no public developer API, OpenAPI definition, or
  developer portal, so it is catalogued here as a company profile rather than an
  API provider.
